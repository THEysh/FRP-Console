name: release

# 打 tag（v1.1.0 这种）时自动构建 Windows 安装包并挂到 Release。
# 也可以在 Actions 页面手动触发，构建产物只作为 artifact 上传，不发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder 要额外下载 electron 压缩包和 nsis / winCodeSign 组件，
      # 这些都在 %LOCALAPPDATA% 的缓存里。缓存下来既快，也能少踩一次下载失败。
      - name: 缓存打包器二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-

      # 内置 frpc.exe 每版都一样（0.61.0），缓存下来就没必要每次去 GitHub 下载：
      # v1.2.92 / v1.2.94 两次发版都是栽在下载这一步的偶发 502 上。
      - name: 缓存内置 frpc
        uses: actions/cache@v4
        with:
          path: vendor/frpc
          key: frpc-0.61.0-windows-amd64

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 发版闸门：语法检查 + 单元测试 + 机密检查，任何一项红掉都不继续打包。
      # 打包出坏包用户装完直接不可用，而带进真实密码会随公开仓库与安装包一起发出去。
      - name: 静态检查与单元测试
        run: npm run test

      # 安装包要内置 frpc.exe（extraResources 从 vendor/frpc 取）。这里显式下载并校验，
      # 而不是靠 npm script：CI 跑的是 npx electron-builder，不会经过 dist 脚本。
      # 下载失败必须让流水线红掉——否则打出来的包缺 frpc，用户装完直接不可用。
      - name: 准备内置 frpc.exe
        shell: pwsh
        run: |
          # 这个步骤在 1.2.94/95/96/100/101 反复红过，而 job 日志需要 admin 权限才能读，
          # 所以这里改成「不依赖任何外部条件」的确定性流程：
          #   1) 只用仓库自带的压缩包（已提交进 git，不走网络）
          #   2) 先校验 sha256，不符就报出实际值（.gitattributes 已把 *.zip 标成 binary）
          #   3) 用 .NET 的 ZipFile 解压，不依赖 Expand-Archive / tar 的行为差异
          $ErrorActionPreference = 'Stop'
          $zip = 'vendor/frp-src/frp_0.61.0_windows_amd64.zip'
          $want = 'ab7ae0633df538b35d0490212eabfd6d3a0051e9e446ae0053c9f63921a8c46e'
          if (-not (Test-Path $zip)) { throw "仓库里没有 $zip" }
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "压缩包 sha256: $got"
          if ($got -ne $want) { throw "压缩包 sha256 不符：期望 $want，实际 $got" }

          if (Test-Path 'vendor/frpc') { Remove-Item -Recurse -Force 'vendor/frpc' }
          New-Item -ItemType Directory -Force 'vendor/frpc' | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $tmp = Join-Path $env:RUNNER_TEMP 'frp-unzip'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $zip).Path, $tmp)

          $exe = Get-ChildItem -Path $tmp -Recurse -Filter 'frpc.exe' | Select-Object -First 1
          if (-not $exe) { throw '压缩包里没有 frpc.exe' }
          Copy-Item $exe.FullName 'vendor/frpc/frpc.exe' -Force
          $info = Get-Item 'vendor/frpc/frpc.exe'
          Write-Host "已就绪：$($info.Name) $($info.Length) 字节"
          if ($info.Length -lt 10MB) { throw "frpc.exe 大小异常：$($info.Length) 字节" }

      - name: 打包 NSIS 安装包
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($i = 1; $i -le 2; $i++) {
            npx electron-builder --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 1) {
              Write-Host "::warning::第 1 次打包失败，30 秒后重试"
              Start-Sleep -Seconds 30
            }
          }
          throw "electron-builder 连续两次失败"

      - name: 打包便携版
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($i = 1; $i -le 2; $i++) {
            npx electron-builder --win portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 1) {
              Write-Host "::warning::第 1 次打包失败，30 秒后重试"
              Start-Sleep -Seconds 30
            }
          }
          throw "electron-builder 连续两次失败"

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # __uninstaller.exe 是 NSIS 的中间产物，unpacked 目录是免安装调试目录，都不要
          Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -notmatch '__uninstaller|unpacked' } |
            Copy-Item -Destination out
          # 自动更新的三件套少一个都不行：latest.yml 给 electron-updater 判断版本，
          # .blockmap 让差分下载只取变化的片段。早先只传了 exe，客户端检查更新会 404。
          Get-ChildItem dist -Filter latest.yml | Copy-Item -Destination out
          Get-ChildItem dist -Filter *.blockmap | Copy-Item -Destination out
          if (-not (Test-Path out/latest.yml)) { throw "缺少 latest.yml，自动更新会失效" }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/*
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
