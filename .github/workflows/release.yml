name: release

# 打 tag（v1.1.0 这种）时自动构建 Windows 安装包并挂到 Release。
# 也可以在 Actions 页面手动触发，构建产物只作为 artifact 上传，不发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder 要额外下载 electron 压缩包和 nsis / winCodeSign 组件，
      # 这些都在 %LOCALAPPDATA% 的缓存里。缓存下来既快，也能少踩一次下载失败。
      - name: 缓存打包器二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-

      # 内置 frpc.exe 每版都一样（0.61.0），缓存下来就没必要每次去 GitHub 下载：
      # v1.2.92 / v1.2.94 两次发版都是栽在下载这一步的偶发 502 上。
      - name: 缓存内置 frpc
        uses: actions/cache@v4
        with:
          path: vendor/frpc
          key: frpc-0.61.0-windows-amd64

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 发版闸门：语法检查 + 单元测试 + 机密检查，任何一项红掉都不继续打包。
      # 打包出坏包用户装完直接不可用，而带进真实密码会随公开仓库与安装包一起发出去。
      - name: 静态检查与单元测试
        run: npm run test

      # 安装包要内置 frpc.exe（extraResources 从 vendor/frpc 取）。这里显式下载并校验，
      # 而不是靠 npm script：CI 跑的是 npx electron-builder，不会经过 dist 脚本。
      # 下载失败必须让流水线红掉——否则打出来的包缺 frpc，用户装完直接不可用。
      - name: 准备内置 frpc.exe
        shell: pwsh
        env:
          FRP_DOWNLOAD_MIRROR: ${{ vars.FRP_DOWNLOAD_MIRROR }}
        run: |
          # 先清掉可能由缓存恢复的半截 vendor/frpc：有它挡着，node 脚本可能判定“已就绪”
          # 或直接在一个坏目录里解压，而报出来的都是「准备内置 frpc.exe 失败」这一句。
          Remove-Item -Recurse -Force vendor/frpc -ErrorAction SilentlyContinue
          Write-Host "仓库自带的压缩包：$(Test-Path vendor/frp-src/frp_0.61.0_windows_amd64.zip)"
          for ($i = 1; $i -le 4; $i++) {
            node tools/fetch-frpc.cjs
            if ($LASTEXITCODE -eq 0 -and (Test-Path vendor/frpc/frpc.exe)) { break }
            if ($i -lt 4) {
              Write-Host "::warning::第 $i 次获取 frpc 失败，25 秒后重试"
              Start-Sleep -Seconds 25
            }
          }
          if (-not (Test-Path vendor/frpc/frpc.exe)) { throw "未拿到 vendor/frpc/frpc.exe，安装包会缺少内置 frpc" }
          Get-Item vendor/frpc/frpc.exe | Select-Object Name, Length

      # 下载类失败绝大多数是网络抖动，重试一次基本就过了；两次都失败就把错误原样抛出。
      - name: 打包 NSIS 安装包
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($i = 1; $i -le 2; $i++) {
            npx electron-builder --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 1) {
              Write-Host "::warning::第 1 次打包失败，30 秒后重试"
              Start-Sleep -Seconds 30
            }
          }
          throw "electron-builder 连续两次失败"

      - name: 打包便携版
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($i = 1; $i -le 2; $i++) {
            npx electron-builder --win portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 1) {
              Write-Host "::warning::第 1 次打包失败，30 秒后重试"
              Start-Sleep -Seconds 30
            }
          }
          throw "electron-builder 连续两次失败"

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # __uninstaller.exe 是 NSIS 的中间产物，unpacked 目录是免安装调试目录，都不要
          Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -notmatch '__uninstaller|unpacked' } |
            Copy-Item -Destination out
          # 自动更新的三件套少一个都不行：latest.yml 给 electron-updater 判断版本，
          # .blockmap 让差分下载只取变化的片段。早先只传了 exe，客户端检查更新会 404。
          Get-ChildItem dist -Filter latest.yml | Copy-Item -Destination out
          Get-ChildItem dist -Filter *.blockmap | Copy-Item -Destination out
          if (-not (Test-Path out/latest.yml)) { throw "缺少 latest.yml，自动更新会失效" }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/*
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
