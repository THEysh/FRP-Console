<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FRP 控制台</title>
<style>
  :root {
    --text: #e9eef7;
    --text-2: #a8b4c7;
    --text-3: #6f7f96;
    --line: rgba(148, 163, 184, 0.13);
    --accent: #5ad1ff;
    --green: #2ee0a0;
    --amber: #ffc35c;
    --red: #ff7676;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }

  html, body {
    margin: 0;
    background: transparent;
    color: var(--text);
    font: 12.5px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* 外面这圈留白是给阴影的：透明窗口会把溢出的阴影裁掉。 */
  body { padding: 7px; }

  .card {
    border: 1px solid var(--line);
    border-radius: 11px;
    background: linear-gradient(180deg, #131a28 0%, #0c1220 100%);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    padding: 5px;
  }

  /* ---- 头部状态 ---- */
  .head { padding: 5px 8px 7px; }
  .hline { display: flex; align-items: center; gap: 6px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex: 0 0 auto; background: var(--text-3);
  }
  .dot.online { background: var(--green); box-shadow: 0 0 0 3px rgba(46, 224, 160, 0.14); }
  .dot.idle { background: var(--text-3); box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.12); }
  .dot.starting { background: var(--amber); box-shadow: 0 0 0 3px rgba(255, 195, 92, 0.14); }
  .dot.error { background: var(--red); box-shadow: 0 0 0 3px rgba(255, 118, 118, 0.14); }
  .hlabel { font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; }
  .haddr {
    margin-top: 3px;
    font: 11px/1.3 var(--mono);
    color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hsub { margin-top: 1px; font-size: 11px; color: var(--text-3); }

  .sep { height: 1px; margin: 4px 7px; background: var(--line); }

  /* ---- 菜单行 ---- */
  .row {
    display: flex; align-items: center; gap: 6px;
    height: 27px; padding: 0 8px;
    border-radius: 6px;
    font-size: 12.5px; color: var(--text);
    white-space: nowrap; overflow: hidden;
  }
  .row .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .row .tag {
    flex: 0 0 auto;
    font-size: 10.5px; color: var(--text-3);
  }
  .row:hover, .row.active { background: rgba(90, 209, 255, 0.11); }
  .row.dim { color: var(--text-3); opacity: 0.5; }
  .row.dim:hover { background: transparent; }
  .row.danger { color: #ff9d9d; }
  .row.danger:hover, .row.danger.active { background: rgba(255, 118, 118, 0.13); }

  .check {
    flex: 0 0 13px;
    width: 13px; height: 13px;
    color: var(--accent);
    opacity: 0;
  }
  .row.checked .check { opacity: 1; }
  .row.checked { color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="hline"><span class="dot" id="dot"></span><span class="hlabel" id="hlabel">隧道状态</span></div>
      <div class="haddr" id="haddr"></div>
      <div class="hsub" id="hsub"></div>
    </div>
    <div id="list"></div>
  </div>

<script>
(() => {
  const api = window.trayAPI;
  const dot = document.getElementById('dot');
  const hlabel = document.getElementById('hlabel');
  const haddr = document.getElementById('haddr');
  const hsub = document.getElementById('hsub');
  const list = document.getElementById('list');

  const CHECK = '<svg class="check" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<path d="M3.5 8.5l3 3 6-6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let rows = [];
  let cursor = -1;

  function render(model, keepCursor) {
    model = model || {};
    const tone = model.tone || 'idle';
    dot.className = 'dot ' + tone;
    hlabel.textContent = model.label || '隧道状态';
    haddr.textContent = model.addr || '';
    hsub.textContent = model.proxyLine || '';

    list.textContent = '';
    const items = [];
    (model.sections || []).forEach((section, i) => {
      if (i > 0) {
        const sep = document.createElement('div');
        sep.className = 'sep';
        list.appendChild(sep);
      }
      section.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'row'
          + (item.enabled === false ? ' dim' : '')
          + (item.kind === 'danger' ? ' danger' : '')
          + (item.checked ? ' checked' : '');
        row.dataset.id = item.id;
        if (item.checked !== undefined) {
          row.innerHTML = CHECK + '<span class="label"></span>';
        } else {
          row.innerHTML = '<span class="label"></span>';
        }
        row.querySelector('.label').textContent = item.label;
        if (item.tag) {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = item.tag;
          row.appendChild(tag);
        }
        if (item.enabled !== false) {
          row.addEventListener('mouseenter', () => setCursor(items.indexOf(row)));
          row.addEventListener('click', () => activate(row.dataset.id));
        }
        list.appendChild(row);
        items.push(row);
      });
    });

    const prev = cursor;
    rows = items;
    cursor = keepCursor && prev >= 0 && rows[prev] && !rows[prev].classList.contains('dim') ? prev : -1;
    paint();

    // 返回实测高度，由主进程决定窗口大小
    return new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        resolve(Math.ceil(document.body.getBoundingClientRect().height));
      }));
    });
  }

  function paint() {
    rows.forEach((row, i) => row.classList.toggle('active', i === cursor));
    if (cursor >= 0 && rows[cursor]) rows[cursor].scrollIntoView({ block: 'nearest' });
  }

  function setCursor(index) {
    cursor = index;
    paint();
  }

  function move(step) {
    const usable = rows.map((r, i) => (r.classList.contains('dim') ? -1 : i)).filter((i) => i >= 0);
    if (!usable.length) return;
    const at = usable.indexOf(cursor);
    const next = at === -1 ? (step > 0 ? usable[0] : usable[usable.length - 1]) : usable[(at + step + usable.length) % usable.length];
    cursor = next;
    paint();
  }

  function activate(id) {
    if (!id) return;
    api.invoke(id);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { api.hide(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); return; }
    if (e.key === 'Enter' || e.key === ' ') {
      if (cursor >= 0 && rows[cursor]) { e.preventDefault(); activate(rows[cursor].dataset.id); }
    }
  });

  // 面板里不要出现系统右键菜单
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  window.__trayRender = render;
})();
</script>
</body>
</html>
